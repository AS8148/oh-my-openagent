name: Desktop engine

on:
  push:
    branches: [master, dev]
    paths:
      - "crates/**"
      - "packages/senpi-desktop-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "script/build-omo-binary.ts"
      - "script/desktop-engine-*.ts"
      - "script/release-desktop-engine-target.ts"
      - "script/desktop-engine-ci-proof.ts"
      - "script/release-desktop-engine-fixture.json"
      - ".github/workflows/publish-platform.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/desktop-engine.yml"
  pull_request:
    branches: [master, dev]
    paths:
      - "crates/**"
      - "packages/senpi-desktop-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "script/build-omo-binary.ts"
      - "script/desktop-engine-*.ts"
      - "script/release-desktop-engine-target.ts"
      - "script/desktop-engine-ci-proof.ts"
      - "script/release-desktop-engine-fixture.json"
      - ".github/workflows/publish-platform.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/desktop-engine.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-contract:
    name: desktop native contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, rust_target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, rust_target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, rust_target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, rust_target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, rust_target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"

      - name: Install display test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y xvfb at-spi2-core dbus dbus-x11 xterm xdotool xfce4-terminal python3-gi gir1.2-gtk-3.0 libatk-adaptor

      - name: Setup Rust
        shell: bash
        run: |
          # ubuntu-22.04 ships Python 3.10, which has no tomllib.
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
          rustup target add "${{ matrix.rust_target }}"

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # TEMPORARY (omo#10762 design 4.4 item 4 amendment): measures why the named custom-anchor test
      # fails, and runs the later helper steps once, before the failing Rust tests stop the job.
      - name: Engine trust measurements (macOS, temporary)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 15
        env:
          OMO_ENGINE_TRUST_HELPER_TARGET_DIR: ${{ github.workspace }}/target/debug
        run: |
          cargo test -p omo-engine-trust-helper --test macos_adapter --locked -- --ignored --nocapture custom_anchor_validity_and_eku_measurement || echo "measurement exited $?"
          cargo test -p omo-engine-trust-helper --test macos_d2_measurement --locked --no-run
          bin=$(find target/debug/deps -maxdepth 1 -type f -perm -u+x -name 'macos_d2_measurement-*' | head -n 1)
          echo "D2 as root"
          sudo "$bin" --ignored --nocapture || echo "D2 root exited $?"
          bun install --frozen-lockfile --ignore-scripts
          cargo build -p omo-engine-trust-helper --bins --examples --locked
          bun test packages/omo-native/test/macos-trust-helper.macos.test.ts || echo "bun macOS test exited $?"
          echo "D2 as the runner user"
          "$bin" --ignored --nocapture || echo "D2 runner user exited $?"

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build desktop engine
        run: cargo build --release -p senpi-desktop-engine --locked --target "${{ matrix.rust_target }}"

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prove staged desktop engine resolution and selftest
        env:
          OMO_DESKTOP_CI_STAGE_DIR: ${{ runner.temp }}/omo-desktop-ci-engine
        run: bun script/desktop-engine-ci-proof.ts

      - name: Verify release asset assembly without publishing
        run: bun test script/desktop-engine-release.test.ts script/release-desktop-engine-target.test.ts script/publish-release-platform-workflow.test.ts

      - name: Desktop package tests
        env:
          OMO_PACKAGE_DIR: ${{ runner.temp }}/omo-desktop-ci-engine
          OMO_DESKTOP_PRELUDE_PYTHON_DIAGNOSTICS: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: bun run test:desktop

      # omo#10762 design 9.3: the engine trust helper against real Security.framework objects, through the
      # production decoder and selectEngineTrust. It reads the runner's stores for the contract only.
      - name: Engine trust helper (macOS)
        if: runner.os == 'macOS'
        env:
          OMO_ENGINE_TRUST_HELPER_TARGET_DIR: ${{ github.workspace }}/target/debug
        run: |
          cargo build -p omo-engine-trust-helper --bins --examples --locked
          bun test packages/omo-native/test/macos-trust-helper.macos.test.ts

      # omo#10762 D2 measurement (lead ruling A). It changes real trust settings, so it runs only on the
      # disposable macOS runner and removes every setting it adds. It reports a result and never gates:
      # a run that needs a UI prompt stops at the step timeout.
      - name: Engine trust D2 measurement (macOS, disposable runner)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cargo test -p omo-engine-trust-helper --test macos_d2_measurement --locked --no-run
          bin=$(find target/debug/deps -maxdepth 1 -type f -perm -u+x -name 'macos_d2_measurement-*' | head -n 1)
          echo "D2 as root"
          sudo "$bin" --ignored --nocapture
          echo "D2 as the runner user"
          "$bin" --ignored --nocapture

      # The runner is disposable, so the live clipboard round-trip may overwrite its clipboard.
      - name: System clipboard round-trip
        if: runner.os != 'Linux'
        run: cargo test -p senpi-desktop-core --features system-clipboard --locked --lib -- --ignored --exact clipboard::live_tests::a_written_text_reads_back_from_the_system_clipboard --nocapture

      # Each #[ignore]d display test runs in the environment its module docs name. The X11 input tests need a
      # window manager and QA windows, so they run in the Linux QA driver instead.
      - name: X11 display tests
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a cargo test -p senpi-desktop-backend-x11 --locked --lib -- --ignored --exact capture::live_tests::captures_root_window stop_path::live_tests::an_xtest_chord_never_latches_the_supervisor
          env -u DISPLAY cargo test -p senpi-desktop-backend-x11 --locked --lib -- --ignored --exact stop_path::live_tests::start_without_a_display_is_unavailable_and_not_live
          xvfb-run -a cargo test -p senpi-desktop-core --features system-clipboard --locked --lib -- --ignored --exact clipboard::live_tests::a_written_text_reads_back_from_the_system_clipboard --nocapture

      # One fresh session bus per AT-SPI test, as the module docs require.
      - name: AT-SPI display tests
        if: runner.os == 'Linux'
        run: |
          for test in ax_tree_of_xterm_lists_window permission_is_toolkits_silent_until_a_toolkit_publishes; do
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p senpi-desktop-backend-atspi --locked --lib -- --ignored --exact "live_tests::$test"
          done
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" cargo test -p senpi-desktop-backend-atspi --locked --lib -- --ignored --exact --nocapture menus_live_tests::menu_listing_and_select_against_a_real_gtk_menu_bar
          env -u AT_SPI_BUS_ADDRESS DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent/senpi-no-bus cargo test -p senpi-desktop-backend-atspi --locked --lib -- --ignored --exact live_tests::no_bus_reports_bus_unreachable

      - name: Write job summary
        if: always()
        shell: bash
        env:
          JOB_SUMMARY_TITLE: Desktop engine native contract (${{ matrix.os }})
          JOB_SUMMARY_STATUS: ${{ job.status }}
          JOB_SUMMARY_DETAILS: |
            - Clippy (-D warnings) and tests across the crates/senpi-desktop-* workspace.
            - Release build of senpi-desktop-engine, then the packages/senpi-desktop-* vitest suites against it.
            - Linux: X11 and AT-SPI display tests under Xvfb and per-test session buses.
          JOB_SUMMARY_NEXT: Start with the first clippy or test failure; a backend crate failing on one OS is usually a cfg-gated path.
        run: GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" bash .github/scripts/write-job-summary.sh
